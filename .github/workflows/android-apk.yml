name: Android test APK

on:
  push:
    branches: [main]
    paths:
      - 'phone/**'
      - 'crates/noteriv-git/**'
      - 'packages/git-client/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: phone
    env:
      CI: 'true'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: phone/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npx --no-install expo prebuild --clean --platform android --no-install
      - name: Read the locked React Native Android toolchain
        id: sdk
        shell: python
        run: |
          import os, tomllib
          with open('node_modules/react-native/gradle/libs.versions.toml', 'rb') as source:
              versions = tomllib.load(source)['versions']
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for name in ('compileSdk', 'buildTools', 'ndkVersion'):
                  print(f'{name}={versions[name]}', file=output)
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-${{ steps.sdk.outputs.compileSdk }}.0 build-tools;${{ steps.sdk.outputs.buildTools }} ndk;${{ steps.sdk.outputs.ndkVersion }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: crates/noteriv-git -> target
      - name: Build native Git for Android
        working-directory: crates/noteriv-git
        env:
          NDK_VERSION: ${{ steps.sdk.outputs.ndkVersion }}
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"
          cargo install cargo-ndk --locked
          cargo ndk -t arm64-v8a -o ../../phone/modules/noteriv-git/android/src/main/jniLibs \
            build --release --locked
      - uses: gradle/actions/setup-gradle@v6
      - name: Build standalone release APK
        working-directory: phone/android
        run: ./gradlew --no-daemon :app:assembleRelease -PreactNativeArchitectures=arm64-v8a
      - name: Verify release APK and embedded JavaScript
        shell: bash
        env:
          BUILD_TOOLS: ${{ steps.sdk.outputs.buildTools }}
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          # Both build variants use the signing key bundled in the Expo template.
          signer=$("$tools/apksigner" verify --print-certs "$apk")
          actual_signer=$(awk -F ': ' '/^Signer #1 certificate SHA-256 digest:/ {print tolower($2)}' <<< "$signer")
          expected_signer=$(keytool -exportcert -keystore android/app/debug.keystore \
            -alias androiddebugkey -storepass android | sha256sum | cut -d ' ' -f 1)
          if [[ "$actual_signer" != "$expected_signer" ]]; then
            echo "Expected signing certificate $expected_signer"
            echo "$signer"
            exit 1
          fi
          badging=$("$tools/aapt" dump badging "$apk")
          if grep -q '^application-debuggable' <<< "$badging"; then
            echo 'Expected a non-debuggable release APK'
            exit 1
          fi
          unzip -t "$apk" 'assets/index.android.bundle' 'lib/arm64-v8a/libreactnative.so' 'lib/arm64-v8a/libnoteriv_git.so'
          mkdir -p ../bundles
          cp "$apk" ../bundles/Noteriv-android-arm64.apk
      - uses: actions/upload-artifact@v7
        with:
          name: noteriv-android-arm64
          path: bundles/Noteriv-android-arm64.apk
          if-no-files-found: error
