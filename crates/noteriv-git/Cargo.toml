[package]
name = "noteriv-git"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "noteriv_git"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
git2 = { version = "0.20", default-features = false, features = ["https", "ssh", "vendored-libgit2", "vendored-openssl"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"
base64 = "0.22"
url = "2"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[dev-dependencies]
tempfile = "3"
